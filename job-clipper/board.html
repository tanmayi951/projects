<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Job Clipper · Board</title>
    <link rel="stylesheet" href="board.css">
  </head>
  <body>
    <header>
      <a href="board.html" class="brand">
        <span>JC</span>
        <b>Job Clipper<small>APPLICATION TRACKER</small></b>
      </a>
      <div class="tools"><input id="search" placeholder="Search roles, companies…"><button id="csv">Export CSV ↓</button></div>
    </header>
    <main>
      <div class="intro">
        <div>
          <div class="kicker">KEEP THE NEXT STEP IN VIEW</div>
          <h1>Your job board</h1>
          <p>Drag a card across stages. Your applications stay in this browser.</p>
        </div>
        <span class="clip" title="Use the Job Clipper toolbar icon while viewing a job page">＋ Use extension icon to clip a job</span>
      </div>
      <div id="board" class="board"></div>
    </main>
    <div id="modal" class="modal" hidden>
      <div class="dialog">
        <button id="close" class="close">×</button>
        <div class="kicker">EDIT APPLICATION</div>
        <h2>Edit job details</h2>
        <label>Role<input id="e-role"></label>
        <label>Company<input id="e-company"></label>
        <label>Job link<input id="e-url"></label>
        <label>Deadline<input id="e-deadline" type="date"></label>
        <button id="saveEdit" class="clip">Save changes</button>
      </div>
    </div>
    <script src="board.js"></script>
  </body>
</html>
